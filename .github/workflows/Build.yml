name: Build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,12 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: "Asia/Shanghai"
      PYTHONPATH: "Scripts"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Sync Ruleset
        run: |
          python -m Build S Network --copy

      - name: Convert Rule
        run: |
          python -m Build C Surge Surge Ruleset --exclude --param --order
          python -m Build C Surge QuantumultX Ruleset/QuantumultX --order
          python -m Build C Surge Stash Ruleset/Stash --order
          python -m Build C Surge Surge Ruleset/Surge --order
          find . -type d -name "__pycache__" -exec rm -rf {} +

      - name: Push Changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config --local user.email "${{ github.actor }}@users.noreply.github.com"
            git config --local user.name "${{ github.actor }}"
            git add -A
            git commit -m "$(date +'%Y-%m-%d %H:%M:%S')"
            git push origin master
          else
            echo "No Repository Update Detected."
          fi

      - name: Delete Workflow Run
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 2
